name: Build Windows

# 个人 fork 专用：只出 Windows x64 安装包，手动触发，产物走 artifact。
# 本机不装依赖，全部构建在 GitHub runner 上完成。
on:
  workflow_dispatch:
  # 默认分支保持与上游一致，手动构建走打标签：git tag build-1 && git push origin build-1
  push:
    tags:
      - 'build-*'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer and main
        run: npm run build

      - name: Package Windows x64 installer
        # package.json 的 win.target 已收成单个 nsis，配合 --x64 只出一个包
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/main/index.js')) { throw 'out/main/index.js 缺失，主进程未构建' }
          if (-not (Test-Path 'out/renderer/index.html')) { throw 'out/renderer/index.html 缺失，渲染层未构建' }

          # 关键校验：确认 VIP 借用代码真的进了 bundle，避免构建出"看起来成功"的旧包
          $scripts = Get-ChildItem -Path 'out/renderer/assets' -Filter '*.js' -Recurse
          if (-not $scripts) { throw '未找到渲染层 bundle' }
          $hit = Select-String -Path $scripts.FullName -Pattern 'vipBorrow' -SimpleMatch -Quiet
          if (-not $hit) { throw '渲染层 bundle 中缺少 vipBorrow，功能未打进产物' }

          # 历史教训：路径被 shell 改写会注入坏 baseURL，这里兜底拦截
          $broken = Select-String -Path $scripts.FullName -Pattern 'Program Files/Git' -SimpleMatch -Quiet
          if ($broken) { throw 'bundle 中出现被 shell 改写的路径，构建环境有问题' }

          $exe = Get-ChildItem -Path 'dist' -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'dist 下没有生成安装包' }
          $exe | ForEach-Object { Write-Host ("安装包: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
